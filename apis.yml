aid: yogaia
name: Yogaia
description: Yogaia is a Finnish online fitness company, founded in 2013 and headquartered
  in Espoo, that streams live and on-demand yoga, Pilates, meditation, and workout
  classes to members on any device. Backed by Point Nine, Inventure, and Sanoma, the
  service runs as a consumer subscription product (web and mobile apps) with sessions
  ranging from three-minute quick practices to sixty-minute relaxation programs. As
  of this enrichment pass Yogaia publishes no public developer program, API reference,
  or SDKs; its api.yogaia.com host serves the session-based web application backend
  rather than a documented public API. This profile was surfaced as a Point Nine portfolio
  lead and is enriched here with verified identity, public web properties, and a live
  domain-security probe.
